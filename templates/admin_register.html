<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Registration | AttendX Vision</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef3f8;
            color: #172033;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;

            transition: background 0.3s ease,
                        color 0.3s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 25px;
            right: 30px;

            padding: 11px 18px;
            border: none;
            border-radius: 10px;

            background: white;
            color: #172033;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .register-card {
            width: 100%;
            max-width: 500px;

            background: white;

            border-radius: 24px;

            padding: 45px 45px 40px;

            box-shadow:
                0 18px 45px rgba(15, 23, 42, 0.12);

            text-align: center;
        }

        .icon {
            width: 78px;
            height: 78px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #e8f0ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }

        h1 {
            font-size: 31px;
            margin-bottom: 9px;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-size: 15px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 54px;

            padding: 0 16px;

            border: 1px solid #cbd5e1;
            border-radius: 11px;

            background: #f8fafc;

            font-size: 16px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);

            background: white;
        }

        .register-button {
            width: 100%;
            height: 58px;

            margin-top: 8px;

            border: none;
            border-radius: 11px;

            background: #2563eb;
            color: white;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .register-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .login-text {
            margin-top: 23px;

            font-size: 14px;
            color: #64748b;
        }

        .login-text a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;

            margin-top: 15px;

            color: #64748b;

            font-size: 14px;

            text-decoration: none;
        }

        .home-link:hover {
            color: #2563eb;
        }


        /* =========================
           DARK MODE
           ========================= */

        body.dark {
            background: #0f172a;
            color: #f8fafc;
        }

        body.dark .register-card {
            background: #1e293b;

            box-shadow:
                0 18px 45px rgba(0,0,0,0.35);
        }

        body.dark .subtitle,
        body.dark .login-text {
            color: #94a3b8;
        }

        body.dark input {
            background: #0f172a;
            color: #f8fafc;
            border-color: #475569;
        }

        body.dark input:focus {
            background: #0f172a;
            border-color: #60a5fa;
        }

        body.dark .theme-toggle {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
        }

        body.dark .home-link {
            color: #94a3b8;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 550px) {

            body {
                padding: 25px 15px;
            }

            .theme-toggle {
                top: 15px;
                right: 15px;
            }

            .register-card {
                padding: 38px 25px 32px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <button
        class="theme-toggle"
        id="themeButton"
        onclick="toggleTheme()">
        🌙 Dark Mode
    </button>


    <div class="register-card">

        <div class="icon">
            👨‍💼
        </div>

        <h1>Admin Registration</h1>

        <p class="subtitle">
            Create an administrator account
        </p>


        <form method="POST">

    <!-- Admin Username -->
    <div class="form-group">

        <label for="username">
            Admin Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter admin username"
            required>

    </div>


    <!-- Phone Number -->
    <div class="form-group">

        <label for="phone">
            Phone Number
        </label>

        <div style="display: flex; gap: 8px;">

            <span style="
                display: flex;
                align-items: center;
                padding: 0 12px;
                border-radius: 11px;
                background: #f8fafc;
                color: #172033;
                border: 1px solid #cbd5e1;
                font-size: 16px;
            ">
                +91
            </span>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit phone number"
                maxlength="10"
                pattern="[0-9]{10}"
                inputmode="numeric"
                required>

        </div>

    </div>


    <!-- Password -->
    <div class="form-group">

        <label for="password">
            Password
        </label>

        <div style="position: relative;">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                minlength="8"
                maxlength="11"
                required
                style="padding-right: 65px;">

            <button
                type="button"
                onclick="togglePassword('password', this)"
                style="
                    position: absolute;
                    right: 8px;
                    top: 50%;
                    transform: translateY(-50%);
                    background: transparent;
                    border: none;
                    color: #2563eb;
                    cursor: pointer;
                    font-size: 12px;
                ">
                Show
            </button>

        </div>

        <div style="
            margin-top: 8px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
        ">
            <strong>
                Password must contain:
            </strong>
            <br>
            • 8–11 characters
            <br>
            • At least 1 alphabet
            <br>
            • At least 1 number
            <br>
            • At least 1 special character
        </div>

    </div>


    <!-- Confirm Password -->
    <div class="form-group">

        <label for="confirm_password">
            Confirm Password
        </label>

        <div style="position: relative;">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm password"
                minlength="8"
                maxlength="11"
                required
                style="padding-right: 65px;">

            <button
                type="button"
                onclick="togglePassword('confirm_password', this)"
                style="
                    position: absolute;
                    right: 8px;
                    top: 50%;
                    transform: translateY(-50%);
                    background: transparent;
                    border: none;
                    color: #2563eb;
                    cursor: pointer;
                    font-size: 12px;
                ">
                Show
            </button>

        </div>

    </div>


    <button
        type="submit"
        class="register-button">
        Create Admin Account
    </button>

</form>


        <div class="login-text">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Admin Login
            </a>

        </div>


        <a
            href="{{ url_for('home') }}"
            class="home-link">
            ← Back to Home
        </a>

    </div>


    <script>

        function toggleTheme() {

            document.body.classList.toggle("dark");

            const button =
                document.getElementById("themeButton");

            if (document.body.classList.contains("dark")) {

                button.innerHTML = "☀️ Light Mode";

                localStorage.setItem(
                    "authTheme",
                    "dark"
                );

            } else {

                button.innerHTML = "🌙 Dark Mode";

                localStorage.setItem(
                    "authTheme",
                    "light"
                );
            }
        }


        window.onload = function () {

            const savedTheme =
                localStorage.getItem("authTheme");

            if (savedTheme === "dark") {

                document.body.classList.add("dark");

                document.getElementById(
                    "themeButton"
                ).innerHTML = "☀️ Light Mode";
            }
        };

        function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "Hide";
    } else {
        input.type = "password";
        button.textContent = "Show";
    }
}

    </script>

</body>
</html>
